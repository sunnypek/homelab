name: Update Service
run-name: Update ${{ inputs.service }}
on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        options:
          - seerr
          - jellyfin
          - bazarr
          - flaresolverr
          - homeassistant
          - node-exporter
          - radarr
          - smartctl-exporter
          - wordpress
          - cross-seed
          - go2rtc
          - prometheus
          - sonarr
          - grafana
          - nginx
          - prowlarr
          - transmission

jobs:
  deploy:
    name: Deploy ${{ inputs.service }}
    runs-on: ubuntu-latest
    steps:
      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Update ${{ inputs.service }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh ${{ secrets.HOST }} << EOF
          cd ${{secrets.PATH }}${{ github.event.inputs.service }}
          docker compose pull
          docker compose up -d
          docker image prune -af
          EOF
